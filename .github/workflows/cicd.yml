          #   -t ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/notification-service:latest .
          # docker push ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/notification-service:${{ github.sha }}
          # docker push ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/notification-service:latest
