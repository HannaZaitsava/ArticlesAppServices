name: BUILD_AND_TEST

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

# Обязательные права для публикации образов в GitHub Packages (GHCR)
permissions:
  contents: read
  packages: write

jobs:
  # =========================================================================
  # 1. ФАЗА ТЕСТИРОВАНИЯ 
  # =========================================================================
  test:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # КЭШИРОВАНИЕ: сохраняет скачанные NuGet-пакеты между запусками пайплайна
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.slnx', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # Восстановление зависимостей с использованием нового формата .slnx
      - name: Restore dependencies
        run: dotnet restore ArticlesApp.slnx

      - name: Create empty .env file
        run: touch .env

      - name: Run All Tests
        run: dotnet test ArticlesApp.slnx --configuration Debug --verbosity normal

  # =========================================================================
  # 2. ФАЗА СБОРКИ РЕШЕНИЯ
  # =========================================================================
  build:
    name: Compile Solution (Release)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Используем кэш, созданный на этапе тестирования
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.slnx', '**/*.csproj') }}

      - name: Restore dependencies
        run: dotnet restore ArticlesApp.slnx

      - name: Create empty .env file
        run: touch .env

      - name: Build Solution
        run: dotnet build ArticlesApp.slnx --no-restore --configuration Release

  # =========================================================================
  # 3. ФАЗА СБОРКИ И ДЕПЛОЯ DOCKER-ОБРАЗОВ В GITHUB PACKAGES (GHCR)
  # =========================================================================
  publish-images:
    name: Build & Push Docker Images to GHCR
    needs: build
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Авторизация в GitHub Container Registry с использованием системного токена
      # Временно отключаем логин, так как стадию пуша пока исключаем
      # - name: Log in to GitHub Container Registry
      #   uses: docker/login-action@v3
      #   with:
      #     registry: ${{ env.REGISTRY }}
      #     username: ${{ github.actor }}
      #     password: ${{ secrets.GITHUB_TOKEN }}

      # Переводим имя репозитория в нижний регистр (требование Docker к тегам)
      # Временно отключаем переменную нижнего регистра, так как стадию пуша пока исключаем
      # - name: Convert repository owner to lowercase
      #   run: |
      #     echo "OWNER_LC=${OWNER,,}" >> ${GITHUB_ENV}
      #   env:
      #     OWNER: '${{ github.repository_owner }}'

      # --- СБОРКА И ПУШ СЕРВИСА СТАТЕЙ (Articles API) ---
      - name: Build and Push Articles API
        run: |
          docker build \
            -f ./src/Services/ArticlesService/ArticlesAPI/Dockerfile \
            -t articles-api:${{ github.sha }} \
            -t articles-api:latest .
          # docker build \
          #   -f ./src/Services/ArticlesService/ArticlesAPI/Dockerfile \
          #   -t ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/articles-api:${{ github.sha }} \
          #   -t ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/articles-api:latest .
          # docker push ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/articles-api:${{ github.sha }}
          # docker push ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/articles-api:latest

      # --- СБОРКА И ПУШ ВОРКЕРА OUTBOX (Articles Outbox Worker) ---
      - name: Build and Push Articles Outbox Worker
        run: |
         docker build \
            -f ./src/Services/ArticlesService/ArticlesWorkers/ArticlesOutboxWorker/Dockerfile \
            -t articles-outbox-worker:${{ github.sha }} \
            -t articles-outbox-worker:latest .
          # docker build \
          #   -f ./src/Services/ArticlesService/ArticlesWorkers/ArticlesOutboxWorker/Dockerfile \
          #   -t ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/articles-outbox-worker:${{ github.sha }} \
          #   -t ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/articles-outbox-worker:latest .
          # docker push ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/articles-outbox-worker:${{ github.sha }}
          # docker push ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/articles-outbox-worker:latest

      # --- СБОРКА И ПУШ СЕРВИСА УВЕДОМЛЕНИЙ (Notification Service) ---
      - name: Build and Push Notification Service
        run: |
         docker build \
            -f ./src/Services/NotificationService/Dockerfile \
            -t notification-service:${{ github.sha }} \
            -t notification-service:latest .
          # docker build \
